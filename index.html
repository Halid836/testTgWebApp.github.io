<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="styles/style.css"/>
  <title>Hello, World!</title>
</head>
<body>
  <h1>
Shop
  </h1>
  <button id="btn">Заказать</button>
  <script src="https://telegram.org/js/telegram-web-app.js?63">
  //script
  const tg = window.Telegram.WebApp; //деталь1
  
  tg.ready(); //открытие app.
  
  tg.expand(); //весь экран
  
  const user = tg.initData.user;
  
  if(user){
    document.querySelector('h1').textContent="Привет,"+user.first_name;
  }
  
  Button
  const btn = document.getElementById('btn');
  btn.addEventListener('click',()=>{
    tg.showAlert("Товар оформлен")
  });
  //MainButton
  tg.MainButton.text="Pay";
  tg.MainButton.show();
  tg.MainButton.onClick(()=>{
    tg.MainButton.hide();
    tg.showAlert("Оплачено");
  });
  </script>
</body>
</html>
