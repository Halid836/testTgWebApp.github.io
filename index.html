<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Дневник</title>
  <style>
    :root {
      --tg-bg: var(--tg-theme-bg-color, #ffffff);
      --tg-text: var(--tg-theme-text-color, #000000);
      --tg-hint: var(--tg-theme-hint-color, #999999);
      --tg-link: var(--tg-theme-link-color, #2ea6ff);
      --tg-button: var(--tg-theme-button-color, #2ea6ff);
      --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
      --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-bg);
      color: var(--tg-text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 15px;
      padding-bottom: 80px;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 10px 0;
    }
    
    .header-title {
      font-size: 22px;
      font-weight: 600;
    }
    
    .header-count {
      font-size: 14px;
      color: var(--tg-hint);
    }
    
    .search-bar {
      margin-bottom: 15px;
    }
    
    .search-input {
      width: 100%;
      padding: 10px 15px;
      background: var(--tg-secondary-bg);
      border: none;
      border-radius: 12px;
      color: var(--tg-text);
      font-size: 14px;
      outline: none;
    }
    
    .search-input::placeholder {
      color: var(--tg-hint);
    }
    
    .entries-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .entry-card {
      background: var(--tg-secondary-bg);
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .entry-card:active {
      transform: scale(0.98);
    }
    
    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .entry-date {
      font-size: 12px;
      color: var(--tg-hint);
    }
    
    .entry-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    
    .entry-preview {
      font-size: 13px;
      color: var(--tg-hint);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .entry-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 8px;
    }
    
    .action-btn {
      padding: 5px 10px;
      background: none;
      border: none;
      color: var(--tg-hint);
      cursor: pointer;
      font-size: 16px;
      transition: color 0.2s;
    }
    
    .action-btn:active {
      color: var(--tg-text);
    }
    
    .action-btn.delete:active {
      color: #ff3b30;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--tg-hint);
    }
    
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
    
    .empty-state-text {
      font-size: 15px;
      line-height: 1.5;
    }
    
    .editor-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--tg-bg);
      z-index: 1000;
      flex-direction: column;
    }
    
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid var(--tg-secondary-bg);
    }
    
    .editor-close {
      background: none;
      border: none;
      color: var(--tg-link);
      font-size: 16px;
      cursor: pointer;
      padding: 5px 10px;
    }
    
    .editor-title-input {
      width: 100%;
      padding: 15px;
      border: none;
      background: transparent;
      color: var(--tg-text);
      font-size: 20px;
      font-weight: 600;
      outline: none;
    }
    
    .editor-title-input::placeholder {
      color: var(--tg-hint);
    }
    
    .editor-content {
      flex: 1;
      padding: 15px;
      border: none;
      background: transparent;
      color: var(--tg-text);
      font-size: 15px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }
    
    .editor-content::placeholder {
      color: var(--tg-hint);
    }
    
    .editor-footer {
      padding: 10px 15px;
      border-top: 1px solid var(--tg-secondary-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .editor-info {
      font-size: 12px;
      color: var(--tg-hint);
    }
  </style>
</head>
<body>
  <div class="container" id="mainView">
    <div class="header">
      <div class="header-title">📔 Дневник</div>
      <div class="header-count" id="entryCount">0 записей</div>
    </div>
    
    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск записей...">
    </div>
    
    <div class="entries-list" id="entriesList"></div>
  </div>
  
  <div class="editor-modal" id="editorModal">
    <div class="editor-header">
      <button class="editor-close" id="editorClose">Отмена</button>
      <button class="editor-close" id="editorSave" style="font-weight: 600;">Сохранить</button>
    </div>
    <input type="text" class="editor-title-input" id="editorTitle" placeholder="Заголовок">
    <textarea class="editor-content" id="editorContent" placeholder="Начните писать..."></textarea>
    <div class="editor-footer">
      <span class="editor-info" id="editorInfo"></span>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    const user = tg.initDataUnsafe?.user;
    const userId = user ? user.id : 'anonymous';
    
    let entries = JSON.parse(localStorage.getItem(`diary_${userId}`) || '[]');
    let editingId = null;
    let searchQuery = '';
    
    function saveEntries() {
      localStorage.setItem(`diary_${userId}`, JSON.stringify(entries));
      updateCount();
      renderEntries();
      updateMainButton();
    }
    
    function updateCount() {
      document.getElementById('entryCount').textContent = entries.length + ' записей';
    }
    
    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diff = now - date;
      
      if (diff < 60000) return 'Только что';
      if (diff < 3600000) return Math.floor(diff / 60000) + ' мин назад';
      if (diff < 86400000) return Math.floor(diff / 3600000) + ' ч назад';
      if (diff < 604800000) return Math.floor(diff / 86400000) + ' дн назад';
      
      return date.toLocaleDateString('ru-RU', { 
        day: 'numeric', 
        month: 'long',
        year: 'numeric'
      });
    }
    
    function renderEntries() {
      const entriesList = document.getElementById('entriesList');
      
      let filteredEntries = entries;
      if (searchQuery) {
        filteredEntries = entries.filter(entry => 
          entry.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          entry.content.toLowerCase().includes(searchQuery.toLowerCase())
        );
      }
      
      filteredEntries.sort((a, b) => new Date(b.date) - new Date(a.date));
      
      if (filteredEntries.length === 0) {
        if (searchQuery) {
          entriesList.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">🔍</div>
              <div class="empty-state-text">Ничего не найдено<br>по запросу "${escapeHtml(searchQuery)}"</div>
            </div>
          `;
        } else {
          entriesList.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📝</div>
              <div class="empty-state-text">Здесь пока пусто<br>Нажмите "Новая запись" чтобы начать</div>
            </div>
          `;
        }
        return;
      }
      
      entriesList.innerHTML = filteredEntries.map(entry => `
        <div class="entry-card" onclick="editEntry(${entry.id})">
          <div class="entry-header">
            <span class="entry-date">${formatDate(entry.date)}</span>
          </div>
          <div class="entry-title">${escapeHtml(entry.title) || 'Без заголовка'}</div>
          <div class="entry-preview">${escapeHtml(entry.content)}</div>
          <div class="entry-actions">
            <button class="action-btn" onclick="event.stopPropagation(); editEntry(${entry.id})">✏️</button>
            <button class="action-btn delete" onclick="event.stopPropagation(); deleteEntry(${entry.id})">🗑</button>
          </div>
        </div>
      `).join('');
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    window.editEntry = function(id) {
      const entry = entries.find(e => e.id === id);
      if (entry) {
        editingId = id;
        document.getElementById('editorTitle').value = entry.title;
        document.getElementById('editorContent').value = entry.content;
        document.getElementById('editorInfo').textContent = 'Редактирование записи';
        openEditor();
      }
    };
    
    window.deleteEntry = function(id) {
      tg.showConfirm('Удалить запись?', (confirmed) => {
        if (confirmed) {
          entries = entries.filter(entry => entry.id !== id);
          saveEntries();
          tg.HapticFeedback.notificationOccurred('success');
        }
      });
    };
    
    function createEntry() {
      editingId = null;
      document.getElementById('editorTitle').value = '';
      document.getElementById('editorContent').value = '';
      document.getElementById('editorInfo').textContent = 'Новая запись';
      openEditor();
    }
    
    function openEditor() {
      document.getElementById('editorModal').style.display = 'flex';
      document.getElementById('mainView').style.display = 'none';
      setTimeout(() => {
        document.getElementById('editorTitle').focus();
      }, 100);
    }
    
    function closeEditor() {
      document.getElementById('editorModal').style.display = 'none';
      document.getElementById('mainView').style.display = 'block';
    }
    
    function saveEditor() {
      const title = document.getElementById('editorTitle').value.trim();
      const content = document.getElementById('editorContent').value.trim();
      
      if (!title && !content) {
        tg.showAlert('Запись пустая');
        return;
      }
      
      if (editingId) {
        const entry = entries.find(e => e.id === editingId);
        if (entry) {
          entry.title = title;
          entry.content = content;
          entry.date = new Date().toISOString();
        }
      } else {
        entries.unshift({
          id: Date.now(),
          title: title,
          content: content,
          date: new Date().toISOString()
        });
      }
      
      saveEntries();
      closeEditor();
      tg.HapticFeedback.notificationOccurred('success');
    }
    
    function updateMainButton() {
      tg.MainButton.setText('НОВАЯ ЗАПИСЬ');
      tg.MainButton.show();
    }
    
    tg.MainButton.onClick(createEntry);
    
    document.getElementById('editorClose').addEventListener('click', closeEditor);
    document.getElementById('editorSave').addEventListener('click', saveEditor);
    
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderEntries();
    });
    
    updateCount();
    renderEntries();
    updateMainButton();
  </script>
</body>
</html>
