<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Тест биометрии</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    
    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }
    
    .status {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .status-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 10px;
    }
    
    .status-text {
      font-size: 16px;
      font-weight: 600;
    }
    
    .status-detail {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }
    
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }
    
    .btn:active {
      transform: scale(0.95);
    }
    
    .btn-primary {
      background: #007aff;
      color: white;
    }
    
    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .btn-success {
      background: #34c759;
      color: white;
    }
    
    .btn-danger {
      background: #ff3b30;
      color: white;
    }
    
    .btn-secondary {
      background: #e5e5ea;
      color: #000;
    }
    
    .log {
      margin-top: 20px;
      background: #f8f9fa;
      border-radius: 12px;
      padding: 15px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 13px;
      font-family: monospace;
    }
    
    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid #e5e5ea;
    }
    
    .log-entry:last-child {
      border-bottom: none;
    }
    
    .log-time {
      color: #999;
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🔐 Тест биометрии</h1>
    <p class="subtitle">Проверка работы биометрии в Telegram</p>
    
    <div class="status" id="status">
      <span class="status-icon" id="statusIcon">⏳</span>
      <div class="status-text" id="statusText">Проверка...</div>
      <div class="status-detail" id="statusDetail">Инициализация</div>
    </div>
    
    <button class="btn btn-primary" id="checkBtn">🔍 Проверить биометрию</button>
    <button class="btn btn-success" id="authBtn" disabled>🔓 Авторизоваться</button>
    <button class="btn btn-danger" id="resetBtn">🔄 Сбросить</button>
    
    <div class="log" id="logContainer">
      <div class="log-entry">📱 Запуск теста биометрии...</div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  
  <script>
    // Инициализация Telegram Web App
    let tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    let isBiometricAvailable = false;
    let isBiometricInit = false;
    let logCount = 0;
    
    // Функция для добавления логов
    function addLog(message, type = 'info') {
      const container = document.getElementById('logContainer');
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      
      const icons = {
        'info': 'ℹ️',
        'success': '✅',
        'error': '❌',
        'warning': '⚠️'
      };
      
      entry.innerHTML = `<span class="log-time">${time}</span> ${icons[type] || '📝'} ${message}`;
      container.appendChild(entry);
      container.scrollTop = container.scrollHeight;
      
      // Ограничиваем количество логов
      if (container.children.length > 50) {
        container.removeChild(container.firstChild);
      }
    }
    
    // Обновление статуса
    function updateStatus(icon, text, detail) {
      document.getElementById('statusIcon').textContent = icon;
      document.getElementById('statusText').textContent = text;
      document.getElementById('statusDetail').textContent = detail || '';
    }
    
    // Проверка биометрии
    function checkBiometric() {
      addLog('🔍 Проверка биометрии...', 'info');
      updateStatus('⏳', 'Проверка...', 'Ожидание ответа');
      
      try {
        if (!tg.BiometricManager) {
          addLog('❌ BiometricManager не найден', 'error');
          updateStatus('❌', 'Недоступно', 'BiometricManager не найден');
          document.getElementById('authBtn').disabled = true;
          return;
        }
        
        tg.BiometricManager.isBiometricAvailable(function(available) {
          addLog(`📊 Биометрия доступна: ${available}`, available ? 'success' : 'warning');
          
          if (available) {
            isBiometricAvailable = true;
            updateStatus('✅', 'Биометрия доступна', 'Можно использовать');
            document.getElementById('authBtn').disabled = false;
            
            // Инициализируем биометрию
            tg.BiometricManager.initBiometric(function(success) {
              isBiometricInit = success;
              addLog(`🔐 Инициализация: ${success}`, success ? 'success' : 'error');
              
              if (success) {
                updateStatus('✅', 'Биометрия готова', 'Инициализация успешна');
              } else {
                updateStatus('⚠️', 'Ошибка инициализации', 'Не удалось инициализировать');
              }
            });
          } else {
            isBiometricAvailable = false;
            updateStatus('❌', 'Биометрия недоступна', 'Устройство не поддерживает');
            document.getElementById('authBtn').disabled = true;
          }
        });
      } catch (error) {
        addLog(`❌ Ошибка: ${error.message}`, 'error');
        updateStatus('❌', 'Ошибка', error.message);
        document.getElementById('authBtn').disabled = true;
      }
    }
    
    // Авторизация через биометрию
    function authenticate() {
      if (!isBiometricAvailable || !isBiometricInit) {
        addLog('❌ Биометрия не готова', 'error');
        tg.showAlert('Биометрия не готова');
        return;
      }
      
      addLog('🔓 Запрос авторизации...', 'info');
      updateStatus('⏳', 'Авторизация...', 'Ожидание подтверждения');
      
      try {
        tg.BiometricManager.requestAccess({
          reason: 'Для тестирования биометрии',
          callback: function(granted) {
            addLog(`📊 Доступ предоставлен: ${granted}`, granted ? 'success' : 'error');
            
            if (granted) {
              tg.BiometricManager.authenticate({
                reason: 'Подтверждение теста биометрии',
                callback: function(success) {
                  if (success) {
                    addLog('✅ Авторизация успешна!', 'success');
                    updateStatus('✅', 'Успешно!', 'Биометрия подтверждена');
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert('✅ Авторизация успешна!');
                  } else {
                    addLog('❌ Авторизация отменена', 'error');
                    updateStatus('❌', 'Отменено', 'Пользователь отменил');
                    tg.HapticFeedback.notificationOccurred('error');
                  }
                }
              });
            } else {
              addLog('❌ Доступ запрещён', 'error');
              updateStatus('❌', 'Доступ запрещён', 'Пользователь запретил');
            }
          }
        });
      } catch (error) {
        addLog(`❌ Ошибка: ${error.message}`, 'error');
        updateStatus('❌', 'Ошибка', error.message);
      }
    }
    
    // Сброс
    function reset() {
      addLog('🔄 Сброс состояния', 'info');
      isBiometricAvailable = false;
      isBiometricInit = false;
      document.getElementById('authBtn').disabled = true;
      updateStatus('⏳', 'Сброшено', 'Нажмите "Проверить"');
    }
    
    // Обработчики кнопок
    document.getElementById('checkBtn').addEventListener('click', checkBiometric);
    document.getElementById('authBtn').addEventListener('click', authenticate);
    document.getElementById('resetBtn').addEventListener('click', reset);
    
    // Автоматическая проверка при загрузке
    addLog('📱 Приложение загружено', 'info');
    addLog(`👤 Пользователь: ${tg.initDataUnsafe?.user?.first_name || 'Неизвестно'}`, 'info');
    
    // Проверяем сразу
    setTimeout(checkBiometric, 500);
    
    // Добавляем поддержку MainButton для быстрого теста
    if (tg.MainButton) {
      tg.MainButton.show();
      tg.MainButton.setText('🔓 ТЕСТ БИОМЕТРИИ');
      tg.MainButton.onClick(function() {
        authenticate();
      });
    }
    
    console.log('✅ Тест биометрии запущен');
  </script>
</body>
</html>
