
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Shooter</title>
  <style>
    :root {
      --tg-bg: var(--tg-theme-bg-color, #ffffff);
      --tg-text: var(--tg-theme-text-color, #000000);
      --tg-hint: var(--tg-theme-hint-color, #999999);
      --tg-link: var(--tg-theme-link-color, #2ea6ff);
      --tg-button: var(--tg-theme-button-color, #2ea6ff);
      --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
      --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-bg);
      color: var(--tg-text);
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    
    .container {
      max-width: 500px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: var(--tg-secondary-bg);
      font-size: 14px;
      z-index: 10;
    }
    
    .score {
      font-weight: 600;
      color: var(--tg-link);
    }
    
    .lives {
      color: #ff3b30;
    }
    
    .players {
      color: var(--tg-hint);
      font-size: 12px;
    }
    
    .game-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--tg-bg);
      cursor: crosshair;
    }
    
    .ship {
      position: absolute;
      width: 40px;
      height: 40px;
      font-size: 30px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      transition: none;
    }
    
    .bullet {
      position: absolute;
      width: 4px;
      height: 12px;
      background: var(--tg-link);
      border-radius: 2px;
      pointer-events: none;
      z-index: 4;
    }
    
    .enemy {
      position: absolute;
      width: 30px;
      height: 30px;
      font-size: 24px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3;
      animation: enemyPulse 1s infinite;
    }
    
    @keyframes enemyPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .explosion {
      position: absolute;
      width: 40px;
      height: 40px;
      font-size: 30px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 6;
      animation: explode 0.5s forwards;
    }
    
    @keyframes explode {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }
    
    .start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--tg-bg);
      z-index: 20;
      padding: 20px;
    }
    
    .start-title {
      font-size: 32px;
      margin-bottom: 10px;
    }
    
    .start-subtitle {
      font-size: 14px;
      color: var(--tg-hint);
      margin-bottom: 30px;
      text-align: center;
    }
    
    .start-btn {
      padding: 15px 40px;
      background: var(--tg-button);
      color: var(--tg-button-text);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    
    .start-btn:active {
      opacity: 0.7;
    }
    
    .game-over-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--tg-bg);
      z-index: 20;
      padding: 20px;
    }
    
    .game-over-title {
      font-size: 28px;
      margin-bottom: 10px;
    }
    
    .game-over-score {
      font-size: 18px;
      color: var(--tg-link);
      margin-bottom: 20px;
    }
    
    .group-score {
      text-align: center;
      margin-bottom: 20px;
      padding: 15px;
      background: var(--tg-secondary-bg);
      border-radius: 12px;
      width: 100%;
      max-width: 300px;
    }
    
    .group-score-title {
      font-size: 13px;
      color: var(--tg-hint);
      margin-bottom: 8px;
    }
    
    .group-score-list {
      font-size: 14px;
      line-height: 1.6;
    }
    
    .restart-btn {
      padding: 12px 30px;
      background: var(--tg-button);
      color: var(--tg-button-text);
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    
    .restart-btn:active {
      opacity: 0.7;
    }
    
    .share-btn {
      margin-top: 10px;
      padding: 12px 30px;
      background: var(--tg-secondary-bg);
      color: var(--tg-text);
      border: none;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="score">Счёт: <span id="score">0</span></span>
      <span class="lives">❤️ <span id="lives">3</span></span>
      <span class="players">👥 <span id="playersCount">1</span></span>
    </div>
    
    <div class="game-area" id="gameArea">
      <div class="start-screen" id="startScreen">
        <div class="start-title">🚀 Space Shooter</div>
        <div class="start-subtitle">Играйте с друзьями из группы!<br>Управляйте кораблём касанием экрана</div>
        <button class="start-btn" id="startBtn">ИГРАТЬ</button>
      </div>
      
      <div class="game-over-screen" id="gameOverScreen">
        <div class="game-over-title">💥 Игра окончена</div>
        <div class="game-over-score">Ваш счёт: <span id="finalScore">0</span></div>
        <div class="group-score">
          <div class="group-score-title">🏆 Результаты группы</div>
          <div class="group-score-list" id="groupScores"></div>
        </div>
        <button class="restart-btn" id="restartBtn">ИГРАТЬ СНОВА</button>
        <button class="share-btn" id="shareBtn">ПОДЕЛИТЬСЯ</button>
      </div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    const user = tg.initDataUnsafe?.user;
    const userId = user ? user.id : 'anonymous';
    const userName = user ? user.first_name : 'Игрок';
    
    const gameArea = document.getElementById('gameArea');
    const scoreElement = document.getElementById('score');
    const livesElement = document.getElementById('lives');
    const playersCountElement = document.getElementById('playersCount');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreElement = document.getElementById('finalScore');
    const groupScoresElement = document.getElementById('groupScores');
    
    let score = 0;
    let lives = 3;
    let gameRunning = false;
    let shipX = 0;
    let shipY = 0;
    let bullets = [];
    let enemies = [];
    let explosions = [];
    let enemySpawnInterval = null;
    let gameLoop = null;
    
    const ship = document.createElement('div');
    ship.className = 'ship';
    ship.textContent = '🚀';
    ship.style.display = 'none';
    gameArea.appendChild(ship);
    
    const groupScores = JSON.parse(localStorage.getItem('space_shooter_scores') || '{}');
    
    function updatePlayersCount() {
      const count = Object.keys(groupScores).length || 1;
      playersCountElement.textContent = count;
    }
    
    function saveGroupScore() {
      if (!groupScores[userId] || score > groupScores[userId]) {
        groupScores[userId] = score;
        localStorage.setItem('space_shooter_scores', JSON.stringify(groupScores));
      }
      updatePlayersCount();
    }
    
    function displayGroupScores() {
      const sortedScores = Object.entries(groupScores)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);
      
      if (sortedScores.length === 0) {
        groupScoresElement.innerHTML = 'Нет результатов';
        return;
      }
      
      groupScoresElement.innerHTML = sortedScores.map(([id, scr], index) => {
        const isCurrentUser = String(id) === String(userId);
        return `${index + 1}. ${isCurrentUser ? userName : 'Игрок ' + id.slice(-4)}: ${scr}`;
      }).join('<br>');
    }
    
    function startGame() {
      score = 0;
      lives = 3;
      bullets = [];
      enemies = [];
      explosions = [];
      scoreElement.textContent = '0';
      livesElement.textContent = '3';
      
      startScreen.style.display = 'none';
      gameOverScreen.style.display = 'none';
      
      const rect = gameArea.getBoundingClientRect();
      shipX = rect.width / 2;
      shipY = rect.height - 80;
      ship.style.display = 'block';
      ship.style.left = shipX + 'px';
      ship.style.top = shipY + 'px';
      
      gameRunning = true;
      
      enemySpawnInterval = setInterval(spawnEnemy, 1500);
      gameLoop = requestAnimationFrame(updateGame);
    }
    
    function spawnEnemy() {
      if (!gameRunning) return;
      
      const rect = gameArea.getBoundingClientRect();
      const enemy = document.createElement('div');
      enemy.className = 'enemy';
      enemy.textContent = ['👾', '🛸', '👽'][Math.floor(Math.random() * 3)];
      enemy.style.left = (Math.random() * (rect.width - 40) + 20) + 'px';
      enemy.style.top = '-30px';
      enemy.dataset.speed = (Math.random() * 2 + 1).toString();
      gameArea.appendChild(enemy);
      enemies.push(enemy);
    }
    
    function shoot() {
      if (!gameRunning) return;
      
      const bullet = document.createElement('div');
      bullet.className = 'bullet';
      bullet.style.left = shipX + 'px';
      bullet.style.top = shipY + 'px';
      gameArea.appendChild(bullet);
      bullets.push(bullet);
    }
    
    function createExplosion(x, y) {
      const explosion = document.createElement('div');
      explosion.className = 'explosion';
      explosion.textContent = '💥';
      explosion.style.left = x + 'px';
      explosion.style.top = y + 'px';
      gameArea.appendChild(explosion);
      explosions.push(explosion);
      
      setTimeout(() => {
        explosion.remove();
        explosions = explosions.filter(e => e !== explosion);
      }, 500);
    }
    
    function updateGame() {
      if (!gameRunning) return;
      
      const rect = gameArea.getBoundingClientRect();
      
      bullets.forEach((bullet, bulletIndex) => {
        const bulletY = parseFloat(bullet.style.top) - 8;
        bullet.style.top = bulletY + 'px';
        
        if (bulletY < -20) {
          bullet.remove();
          bullets.splice(bulletIndex, 1);
          return;
        }
        
        enemies.forEach((enemy, enemyIndex) => {
          const bulletRect = bullet.getBoundingClientRect();
          const enemyRect = enemy.getBoundingClientRect();
          
          if (bulletRect.left < enemyRect.right &&
              bulletRect.right > enemyRect.left &&
              bulletRect.top < enemyRect.bottom &&
              bulletRect.bottom > enemyRect.top) {
            
            createExplosion(
              parseFloat(enemy.style.left),
              parseFloat(enemy.style.top)
            );
            
            enemy.remove();
            enemies.splice(enemyIndex, 1);
            bullet.remove();
            bullets.splice(bulletIndex, 1);
            
            score += 10;
            scoreElement.textContent = score;
            tg.HapticFeedback.impactOccurred('light');
          }
        });
      });
      
      enemies.forEach((enemy, enemyIndex) => {
        const speed = parseFloat(enemy.dataset.speed);
        const enemyY = parseFloat(enemy.style.top) + speed;
        enemy.style.top = enemyY + 'px';
        
        if (enemyY > rect.height) {
          enemy.remove();
          enemies.splice(enemyIndex, 1);
          return;
        }
        
        const enemyRect = enemy.getBoundingClientRect();
        const shipRect = ship.getBoundingClientRect();
        
        if (enemyRect.left < shipRect.right &&
            enemyRect.right > shipRect.left &&
            enemyRect.top < shipRect.bottom &&
            enemyRect.bottom > shipRect.top) {
          
          createExplosion(
            parseFloat(enemy.style.left),
            parseFloat(enemy.style.top)
          );
          
          enemy.remove();
          enemies.splice(enemyIndex, 1);
          
          lives--;
          livesElement.textContent = lives;
          tg.HapticFeedback.notificationOccurred('error');
          
          if (lives <= 0) {
            gameOver();
            return;
          }
        }
      });
      
      gameLoop = requestAnimationFrame(updateGame);
    }
    
    function gameOver() {
      gameRunning = false;
      clearInterval(enemySpawnInterval);
      cancelAnimationFrame(gameLoop);
      
      ship.style.display = 'none';
      bullets.forEach(b => b.remove());
      enemies.forEach(e => e.remove());
      explosions.forEach(e => e.remove());
      bullets = [];
      enemies = [];
      explosions = [];
      
      finalScoreElement.textContent = score;
      saveGroupScore();
      displayGroupScores();
      
      gameOverScreen.style.display = 'flex';
      tg.HapticFeedback.notificationOccurred('error');
    }
    
    gameArea.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!gameRunning) return;
      
      const rect = gameArea.getBoundingClientRect();
      const touch = e.touches[0];
      shipX = touch.clientX - rect.left;
      shipY = touch.clientY - rect.top;
      
      shipX = Math.max(20, Math.min(rect.width - 20, shipX));
      shipY = Math.max(40, Math.min(rect.height - 20, shipY));
      
      ship.style.left = shipX + 'px';
      ship.style.top = shipY + 'px';
    });
    
    gameArea.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!gameRunning) return;
      
      const rect = gameArea.getBoundingClientRect();
      const touch = e.touches[0];
      shipX = touch.clientX - rect.left;
      shipY = touch.clientY - rect.top;
      
      shipX = Math.max(20, Math.min(rect.width - 20, shipX));
      shipY = Math.max(40, Math.min(rect.height - 20, shipY));
      
      ship.style.left = shipX + 'px';
      ship.style.top = shipY + 'px';
      
      shoot();
    });
    
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    
    document.getElementById('shareBtn').addEventListener('click', () => {
      const text = `🚀 Мой счёт в Space Shooter: ${score}!\nСможешь побить?`;
      tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`);
    });
    
    updatePlayersCount();
    displayGroupScores();
  </script>
</body>
</html>
