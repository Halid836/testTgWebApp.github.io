<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Заметки</title>
  <style>
    :root {
      --tg-bg: var(--tg-theme-bg-color, #ffffff);
      --tg-text: var(--tg-theme-text-color, #000000);
      --tg-hint: var(--tg-theme-hint-color, #999999);
      --tg-link: var(--tg-theme-link-color, #2ea6ff);
      --tg-button: var(--tg-theme-button-color, #2ea6ff);
      --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
      --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-bg);
      color: var(--tg-text);
      min-height: 100vh;
      padding: 15px;
    }
    
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 80px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 15px;
      font-size: 20px;
      font-weight: 600;
    }
    
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .note-card {
      background: var(--tg-secondary-bg);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .note-card:active {
      transform: scale(0.98);
    }
    
    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    
    .note-date {
      font-size: 11px;
      color: var(--tg-hint);
    }
    
    .note-text {
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      margin-bottom: 6px;
    }
    
    .note-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    
    .note-action-btn {
      padding: 4px 8px;
      background: none;
      border: none;
      color: var(--tg-hint);
      cursor: pointer;
      font-size: 16px;
    }
    
    .note-action-btn:active {
      color: var(--tg-text);
    }
    
    .note-action-btn.delete:active {
      color: #ff3b30;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--tg-hint);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">📝 Заметки</div>
    <div class="notes-list" id="notesList"></div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    const user = tg.initDataUnsafe?.user;
    const userId = user ? user.id : 'anonymous';
    
    let notes = JSON.parse(localStorage.getItem(`notes_${userId}`) || '[]');
    
    function saveNotes() {
      localStorage.setItem(`notes_${userId}`, JSON.stringify(notes));
      renderNotes();
      updateMainButton();
    }
    
    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diff = now - date;
      
      if (diff < 60000) return 'Только что';
      if (diff < 3600000) return Math.floor(diff / 60000) + ' мин назад';
      if (diff < 86400000) return Math.floor(diff / 3600000) + ' ч назад';
      if (diff < 604800000) return Math.floor(diff / 86400000) + ' дн назад';
      
      return date.toLocaleDateString('ru-RU', { 
        day: 'numeric', 
        month: 'short',
        hour: '2-digit',
        minute: '2-digit'
      });
    }
    
    function renderNotes() {
      const notesList = document.getElementById('notesList');
      
      if (notes.length === 0) {
        notesList.innerHTML = '<div class="empty-state">Нет заметок</div>';
        return;
      }
      
      notes.sort((a, b) => new Date(b.date) - new Date(a.date));
      
      notesList.innerHTML = notes.map(note => `
        <div class="note-card">
          <div class="note-header">
            <span class="note-date">${formatDate(note.date)}</span>
          </div>
          <div class="note-text">${escapeHtml(note.text)}</div>
          <div class="note-actions">
            <button class="note-action-btn" onclick="deleteNote(${note.id})">🗑</button>
          </div>
        </div>
      `).join('');
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    window.deleteNote = function(id) {
      tg.showConfirm('Удалить заметку?', (confirmed) => {
        if (confirmed) {
          notes = notes.filter(note => note.id !== id);
          saveNotes();
        }
      });
    };
    
    function createNote() {
      tg.showPopup({
        title: 'Новая заметка',
        message: 'Введите текст',
        buttons: [
          { id: 'cancel', type: 'cancel', text: 'Отмена' },
          { id: 'ok', type: 'default', text: 'Сохранить' }
        ]
      }, (buttonId) => {
        if (buttonId === 'ok') {
          const text = prompt('Введите текст заметки:');
          if (text && text.trim()) {
            const note = {
              id: Date.now(),
              text: text.trim(),
              date: new Date().toISOString()
            };
            notes.unshift(note);
            saveNotes();
            tg.HapticFeedback.notificationOccurred('success');
          }
        }
      });
    }
    
    function updateMainButton() {
      if (notes.length === 0) {
        tg.MainButton.setText('СОЗДАТЬ ЗАМЕТКУ');
        tg.MainButton.show();
      } else {
        tg.MainButton.setText('НОВАЯ ЗАМЕТКА');
        tg.MainButton.show();
      }
    }
    
    tg.MainButton.onClick(createNote);
    
    renderNotes();
    updateMainButton();
  </script>
</body>
</html>
