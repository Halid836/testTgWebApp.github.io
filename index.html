<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TgWebApp</title>
</head>
<body>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <h1>Тест кнопки</h1>
  
  <script>
    let tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    tg.MainButton.show();
    tg.MainButton.setText("ЗАКАЗАТЬ");
    
    tg.MainButton.onClick(function(){
      tg.showAlert("Работает!");
    });
  </script>
</body>
</html>
