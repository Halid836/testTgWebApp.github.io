<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiometricManager</title>
</head>
<body>
  <h1>🔒 Биометрия</h1>
  <p id="status">Инициализация...</p>
  
  <button onclick="payWithBiometric()">Оплатить через биометрию</button>
  <button onclick="checkBiometric()">Проверить биометрию</button>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  
  <script>
    let tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    let biometricReady = false;
    
    checkBiometric();
    
    function checkBiometric() {
      document.getElementById('status').innerText = "Проверка...";
      
      // Проверяем доступность
      tg.BiometricManager.isBiometricAvailable(function(available) {
        if (available) {
          document.getElementById('status').innerText = "✅ Биометрия доступна";
          
          // Инициализируем
          tg.BiometricManager.initBiometric(function(success) {
            if (success) {
              biometricReady = true;
              document.getElementById('status').innerText = "✅ Биометрия готова";
            } else {
              document.getElementById('status').innerText = "❌ Ошибка инициализации";
            }
          });
        } else {
          document.getElementById('status').innerText = "❌ Биометрия недоступна";
        }
      });
    }
    
    function payWithBiometric() {
      if (!biometricReady) {
        tg.showAlert("Биометрия не готова. Нажмите 'Проверить биометрию'");
        return;
      }
      
      // Запрашиваем доступ
      tg.BiometricManager.requestAccess({
        reason: "Для подтверждения оплаты",
        callback: function(granted) {
          if (granted) {
            // Аутентификация
            tg.BiometricManager.authenticate({
              reason: "Подтвердите оплату 1000₽",
              callback: function(success) {
                if (success) {
                  tg.HapticFeedback.notificationOccurred('success');
                  tg.showAlert("✅ Оплата прошла!");
                } else {
                  tg.showAlert("❌ Отменено");
                }
              }
            });
          } else {
            tg.showAlert("Доступ запрещён");
          }
        }
      });
    }
  </script>
</body>
</html>
